services:
  freely:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freely
    ports:
      - "8255:8255"
    environment:
      - PORT=8255
      - NODE_ENV=production
    restart: unless-stopped
    # Optional: mount a volume for yt-dlp cookies (for private content)
